<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SyncTask - Acesso</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke-linecap='round' stroke-linejoin='round'><rect x='3' y='4' width='18' height='18' rx='4' stroke='%239CA3AF' stroke-width='1.5'/><line x1='16' y1='2' x2='16' y2='6' stroke='%239CA3AF' stroke-width='1.5'/><line x1='8' y1='2' x2='8' y2='6' stroke='%239CA3AF' stroke-width='1.5'/><line x1='3' y1='10' x2='21' y2='10' stroke='%239CA3AF' stroke-width='1.5' stroke-opacity='0.5'/><path d='M9 15.5l2 2 4-4' stroke='%23CE1821' stroke-width='2'/></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-[#F5F6F8] font-sans min-h-screen flex items-center justify-center p-4" style="background-image: url('https://i.ibb.co/R4NNxskv/image.png'); background-size: cover; background-position: center; background-attachment: fixed;">

    <div class="bg-white/95 backdrop-blur-sm p-8 rounded-2xl shadow-xl border border-gray-100 w-full max-w-md">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-[#1E2024]">
                <span class="text-[#10B981]">Sync</span>Task
            </h1>
            <p class="text-sm text-[#757575] mt-2" id="form-subtitle">Faça login para gerenciar suas tarefas</p>
        </div>

        <form id="auth-form" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-1">E-mail</label>
                <input type="email" id="email" required class="w-full px-4 py-3 bg-white border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-[#10B981] transition-all shadow-sm">
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-1">Senha</label>
                <input type="password" id="password" required class="w-full px-4 py-3 bg-white border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-[#10B981] transition-all shadow-sm">
            </div>

            <div id="confirm-password-container" class="hidden transform transition-all duration-300">
                <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-1">Confirmar Senha</label>
                <input type="password" id="confirm-password" class="w-full px-4 py-3 bg-white border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-[#10B981] transition-all shadow-sm">
            </div>
            
            <div id="error-msg" class="hidden text-red-500 text-xs font-semibold text-center bg-red-50 p-2 rounded-lg border border-red-100"></div>

            <button type="submit" id="btn-submit" class="w-full bg-[#10B981] hover:bg-[#059669] text-white font-medium px-4 py-3 rounded-xl text-sm transition-all shadow-md shadow-[#10B981]/20 mt-2">
                Entrar
            </button>
        </form>

        <div class="mt-6 text-center">
            <button type="button" id="toggle-mode" class="text-sm text-gray-500 hover:text-[#10B981] font-semibold transition-colors">
                Não tem uma conta? Cadastre-se
            </button>
        </div>
    </div>

    <script>
        // Chave correta e atualizada
        const supabaseClient = window.supabase.createClient('https://lmzwttsgbklrkzlyztid.supabase.co', 'sb_publishable_MLyhf-duOhGCD066RvFC6Q_DJr1yHvo');
        let isLogin = true;

        document.getElementById('toggle-mode').addEventListener('click', () => {
            isLogin = !isLogin;
            
            document.getElementById('btn-submit').textContent = isLogin ? 'Entrar' : 'Criar Conta';
            document.getElementById('form-subtitle').textContent = isLogin ? 'Faça login para gerenciar suas tarefas' : 'Crie sua conta no SyncTask';
            document.getElementById('toggle-mode').textContent = isLogin ? 'Não tem uma conta? Cadastre-se' : 'Já tem uma conta? Faça login';
            document.getElementById('error-msg').classList.add('hidden');
            
            const mainTitle = document.querySelector('h1');
            if (isLogin) {
                mainTitle.innerHTML = '<span class="text-[#10B981]">Sync</span>Task';
            } else {
                mainTitle.innerHTML = '<span class="text-blue-500">Criar</span> Conta';
            }

            const confirmContainer = document.getElementById('confirm-password-container');
            const confirmInput = document.getElementById('confirm-password');
            
            if (isLogin) {
                confirmContainer.classList.add('hidden');
                confirmInput.removeAttribute('required'); 
                confirmInput.value = ''; 
            } else {
                confirmContainer.classList.remove('hidden');
                confirmInput.setAttribute('required', 'true'); 
            }
        });

        document.getElementById('auth-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm-password').value;
            const errorMsg = document.getElementById('error-msg');
            const btn = document.getElementById('btn-submit');
            
            if (!isLogin && password !== confirmPassword) {
                errorMsg.textContent = 'As senhas não coincidem. Tente novamente.';
                errorMsg.classList.remove('hidden');
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Aguarde...';
            errorMsg.classList.add('hidden');

            try {
                const { data, error } = isLogin 
                    ? await supabaseClient.auth.signInWithPassword({ email, password })
                    : await supabaseClient.auth.signUp({ email, password });

                if (error) {
                    console.error("Erro Supabase:", error);
                    throw error;
                }

                if (!isLogin && !data.session) {
                    alert('Conta criada com sucesso! Verifique seu e-mail para confirmar o cadastro antes de entrar.');
                    document.getElementById('toggle-mode').click(); 
                    return; 
                }
                
                // Redirecionamento corrigido para o arquivo com I maiúsculo
                window.location.href = 'index.html';
                
            } catch (err) {
                console.error("Detalhe do Erro:", err);
                // Exibe o erro real vindo do Supabase para facilitar debug
                errorMsg.textContent = err.message || 'Erro inesperado ao processar a solicitação.';
                errorMsg.classList.remove('hidden');
            } finally {
                btn.disabled = false;
                btn.textContent = isLogin ? 'Entrar' : 'Criar Conta';
            }
        });
    </script>
</body>
</html>
